name: build

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: windows
          - os: ubuntu-latest
            archive: linux
    env:
      # Windows 控制台默认不是 UTF-8，PyInstaller 输出中文路径会编码失败
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 同步依赖
        run: uv sync --locked

      - name: 打包 onedir
        run: uv run --no-sync python package.py

      - uses: actions/upload-artifact@v4
        with:
          name: material-check-${{ matrix.archive }}
          path: material-check-${{ matrix.archive }}.zip
          if-no-files-found: error
          retention-days: 30
